<title>【ダミー】院長・事務管理職 予定表</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#fafbfc;
  --border:#e3e6ea; --border-strong:#d2d7de;
  --text:#1b2027; --muted:#6b7580; --faint:#99a1ab;
  --accent:#2f5597; --accent-soft:#e8eef8;
  --sat:#2f6fb5; --sat-bg:#eaf2fb;
  --sun:#c0392b; --sun-bg:#fdeeec;
  --today:#b7791f; --today-bg:#fdf5e2;
  --chip:#eef0f3;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15181d; --surface:#1d2127; --surface-2:#22272e;
    --border:#2e343c; --border-strong:#3a414a;
    --text:#e6e9ed; --muted:#9aa3ad; --faint:#737c86;
    --accent:#7fa6e8; --accent-soft:#232e42;
    --sat:#7fb2e8; --sat-bg:#1b2634;
    --sun:#e8847a; --sun-bg:#33211f;
    --today:#e0b65c; --today-bg:#332c18;
    --chip:#272d35;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#15181d; --surface:#1d2127; --surface-2:#22272e;
  --border:#2e343c; --border-strong:#3a414a;
  --text:#e6e9ed; --muted:#9aa3ad; --faint:#737c86;
  --accent:#7fa6e8; --accent-soft:#232e42;
  --sat:#7fb2e8; --sat-bg:#1b2634;
  --sun:#e8847a; --sun-bg:#33211f;
  --today:#e0b65c; --today-bg:#332c18;
  --chip:#272d35;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-size:15px; line-height:1.55;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 64px}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:20;
  background:var(--surface); border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top);
}
.hd{max-width:720px;margin:0 auto;padding:10px 16px 0}
.hd-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-size:16px;font-weight:700;margin:0;letter-spacing:.01em}
.upd{font-size:11px;color:var(--faint);margin-left:auto;white-space:nowrap}

.tabs{display:flex;gap:4px;margin-top:10px}
.tab{
  flex:1; appearance:none; border:0; background:transparent; cursor:pointer;
  font:inherit; font-size:13.5px; font-weight:600; color:var(--muted);
  padding:9px 4px 10px; border-bottom:2.5px solid transparent;
  border-radius:6px 6px 0 0;
}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

.chips{
  display:flex;gap:6px;overflow-x:auto;padding:9px 0 10px;
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  appearance:none;border:1px solid var(--border-strong);background:var(--surface);
  color:var(--muted);font:inherit;font-size:13px;font-weight:600;
  padding:5px 13px;border-radius:999px;white-space:nowrap;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- date bar ---------- */
.datebar{
  display:flex;align-items:center;gap:8px;
  padding:10px 0 12px;
}
.nav{
  appearance:none;border:1px solid var(--border-strong);background:var(--surface);
  color:var(--text);width:38px;height:38px;border-radius:10px;cursor:pointer;
  font-size:17px;line-height:1;display:grid;place-items:center;flex:none;
}
.range{flex:1;text-align:center;font-weight:700;font-size:15px}
.range small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.btn-today{
  appearance:none;border:1px solid var(--accent);background:var(--accent-soft);
  color:var(--accent);font:inherit;font-size:13px;font-weight:700;
  padding:8px 12px;border-radius:10px;cursor:pointer;flex:none;
}
.searchbox{display:none;padding:10px 0 12px}
.searchbox input{
  width:100%;font:inherit;font-size:16px;padding:11px 13px;
  border:1px solid var(--border-strong);border-radius:10px;
  background:var(--surface);color:var(--text);
}
.searchbox input:focus{outline:2px solid var(--accent);outline-offset:-1px}
body[data-mode="search"] .searchbox{display:block}
body[data-mode="search"] .datebar{display:none}

.count{font-size:12px;color:var(--muted);padding:0 2px 10px}

/* ---------- day ---------- */
.day{margin-bottom:14px}
.dayhdr{
  display:flex;align-items:center;gap:8px;
  font-size:13.5px;font-weight:700;
  padding:6px 10px;border-radius:8px;background:var(--surface-2);
  border:1px solid var(--border);
  position:sticky;top:0;z-index:1;
}
.dayhdr .dow{font-weight:700}
.dayhdr .hol{font-size:11.5px;font-weight:600;color:var(--sun)}
.day.sat .dayhdr{background:var(--sat-bg);color:var(--sat);border-color:transparent}
.day.sun .dayhdr{background:var(--sun-bg);color:var(--sun);border-color:transparent}
.day.today .dayhdr{background:var(--today-bg);color:var(--today);border-color:transparent}
.badge-today{
  font-size:10.5px;font-weight:800;background:var(--today);color:#fff;
  padding:1px 7px;border-radius:999px;letter-spacing:.04em;
}
.duty{
  display:flex;flex-wrap:wrap;gap:6px;
  font-size:11.5px;color:var(--muted);padding:7px 10px 2px;
}
.duty span{background:var(--chip);padding:2px 8px;border-radius:6px;white-space:nowrap}
.duty span b{font-weight:700;color:var(--text)}

ul.evs{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.ev{
  display:flex;gap:11px;background:var(--surface);border:1px solid var(--border);
  border-radius:11px;padding:11px 12px;box-shadow:var(--shadow);
}
.ev .t{
  flex:none;width:52px;font-variant-numeric:tabular-nums;
  font-size:14.5px;font-weight:700;color:var(--accent);padding-top:1px;
}
.ev .t.txt{font-size:11.5px;font-weight:700;line-height:1.35;color:var(--muted)}
.ev .b{min-width:0;flex:1}
.ttl{font-size:14.5px;font-weight:600;line-height:1.4;word-break:break-word}
.meta{font-size:12px;color:var(--muted);margin-top:3px}
.meta .pin{opacity:.6;margin-right:3px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.tag{
  font-size:10.5px;font-weight:700;background:var(--chip);color:var(--muted);
  padding:2px 7px;border-radius:5px;
}
.tag.on{background:var(--accent);color:#fff}
.note{font-size:11.5px;color:var(--faint);margin-top:6px;word-break:break-word}
.empty{text-align:center;color:var(--faint);font-size:13px;padding:36px 0}
.datehint{font-size:11px;color:var(--faint);font-weight:600;margin-left:auto}
footer{text-align:center;font-size:11px;color:var(--faint);padding:22px 0 8px}
</style>

  t.onclick = () => {
    mode = t.dataset.mode;
    document.body.dataset.mode = mode;
    document.querySelectorAll('.tab').forEach(x =>
      x.setAttribute('aria-selected', String(x === t)));
    if (mode !== 'search') cursor = (mode === 'today' || mode === 'week') ? TODAY : cursor;
    render();
    if (mode === 'search') document.getElementById('q').focus();
  };
});

const step = n => {
  const k = mode === 'week' ? 7 : 1;
  if (mode === 'month') { const d = parse(cursor); d.setMonth(d.getMonth()+n); cursor = iso(d); }
  else cursor = addDays(cursor, n*k);
  render();
};
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('jump').onclick = () => { cursor = TODAY; render(); };
document.getElementById('q').addEventListener('input', e => { query = e.target.value.trim(); render(); });

function rangeOf(){
  if (mode === 'today') return [cursor, cursor];
  if (mode === 'week')  return [cursor, addDays(cursor, 6)];
  const d = parse(cursor);
  const from = new Date(d.getFullYear(), d.getMonth(), 1);
  const to   = new Date(d.getFullYear(), d.getMonth()+1, 0);
  return [iso(from), iso(to)];
}

function matches(e){
  if (person >= 0 && !(e[4] & (1 << person))) return false;
  if (mode === 'search' && query) {
    const hay = (e[2] + ' ' + e[3] + ' ' + e[5]).toLowerCase();
    if (!hay.includes(query.toLowerCase())) return false;
  }
  return true;
}

function dutyLine(date){
  const rows = dutyBy[date] || [];
  if (!rows.length) return '';
  const out = [];
  for (const [, kind, who] of rows) {
    if ((kind === '日当直' || kind === '明け') && !who) continue;
    out.push('<span>' + kind + (who ? ' <b>' + esc(who) + '</b>' : '') + '</span>');
  }
  return out.length ? '<div class="duty">' + out.join('') + '</div>' : '';
}

const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function dayBlock(date, evs){
  const d = parse(date), w = d.getDay(), hol = D.holidays[date];
  const cls = ['day'];
  if (date === TODAY) cls.push('today');
  else if (hol || w === 0) cls.push('sun');
  else if (w === 6) cls.push('sat');
  let h = '<section class="' + cls.join(' ') + '">';
  h += '<div class="dayhdr"><span>' + fmt(date) + '</span><span class="dow">('
     + DOW[w] + ')</span>';
  if (hol) h += '<span class="hol">' + esc(hol) + '</span>';
  if (date === TODAY) h += '<span class="badge-today">今日</span>';
  h += '</div>';
  h += dutyLine(date);
  if (evs.length) {
    h += '<ul class="evs">';
    for (const e of evs) {
      const t = e[1];
      const isClock = /^\d{1,2}:\d{2}$/.test(t);
      h += '<li class="ev"><div class="t' + (isClock ? '' : ' txt') + '">'
         + (t ? esc(t) : '—') + '</div><div class="b">';
      h += '<div class="ttl">' + esc(e[2]) + '</div>';
      if (e[3]) h += '<div class="meta"><span class="pin">📍</span>' + esc(e[3]) + '</div>';
      const tags = TANTO.filter((_, i) => e[4] & (1 << i));
      if (tags.length) h += '<div class="tags">' + tags.map(n =>
        '<span class="tag' + (person >= 0 && TANTO[person] === n ? ' on' : '') + '">'
        + n + '</span>').join('') + '</div>';
      if (e[5]) h += '<div class="note">' + esc(e[5]) + '</div>';
      h += '</div></li>';
    }
    h += '</ul>';
  }
  return h + '</section>';
}

function render(){
  const list = document.getElementById('list');
  const rangeEl = document.getElementById('range');
  const countEl = document.getElementById('count');
  let dates = [], total = 0, html = '';

  if (mode === 'search') {
    rangeEl.textContent = '';
    if (!query) { list.innerHTML = '<div class="empty">キーワードを入れてください</div>';
                  countEl.textContent = ''; return; }
    dates = Object.keys(byDate).sort();
  } else {
    const [from, to] = rangeOf();
    const d0 = parse(from), d1 = parse(to);
    for (let d = new Date(d0); d <= d1; d.setDate(d.getDate()+1)) dates.push(iso(d));
    const dd = parse(cursor);
    if (mode === 'month') {
      rangeEl.innerHTML = (dd.getMonth()+1) + '月<small>' + dd.getFullYear() + '年</small>';
    } else if (mode === 'week') {
      rangeEl.innerHTML = fmt(from) + ' 〜 ' + fmt(to) + '<small>7日間</small>';
    } else {
      rangeEl.innerHTML = fmt(cursor) + '（' + DOW[dd.getDay()] + '）'
        + '<small>' + (cursor === TODAY ? '今日' : '&nbsp;') + '</small>';
    }
  }

  for (const date of dates) {
    const evs = (byDate[date] || []).filter(matches);
    const showEmpty = (mode === 'today' || mode === 'week');
    const hasDuty = mode !== 'search' && (dutyBy[date] || [])
      .some(([, k, w]) => w || (k !== '日当直' && k !== '明け'));
    if (!evs.length && !showEmpty && !hasDuty) continue;
    total += evs.length;
    html += dayBlock(date, evs);
  }

  const who = person >= 0 ? TANTO[person] + 'の' : '';
  countEl.textContent = mode === 'search'
    ? who + '該当 ' + total + '件'
    : who + '予定 ' + total + '件';
  list.innerHTML = html || '<div class="empty">予定はありません</div>';
  window.scrollTo({ top: 0 });
}

render();
</script>
</body>
</html>
